[project]
name = "cipherforge-backend"
version = "0.2.0"
description = "CipherForge API"
requires-python = ">=3.12"
# Dependencies live in requirements*.txt so container builds are reproducible.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a real PostgreSQL; set TEST_DATABASE_URL to enable",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
# backend/alembic/ (the migration environment) would otherwise look first-party.
known-third-party = ["alembic"]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
# Asserts, throwaway credentials and fixed tokens are expected in tests.
"tests/**" = ["S101", "S105", "S106", "S108"]
# Alembic migrations are generated code.
"alembic/**" = ["E501"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
