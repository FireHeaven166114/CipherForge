name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job needs to write to the repository or call the GitHub API.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, security, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherforge
          POSTGRES_DB: cipherforge_test
          # Throwaway service container on the runner's loopback; no credential to store.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherforge -d cipherforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cipherforge@localhost:5432/cipherforge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Static security analysis (bandit)
        # devtools (demo server) is scanned too; B311 is skipped because its pseudo-randomness
        # only makes synthetic demo data reproducible.
        run: |
          bandit -c pyproject.toml -r app -q
          bandit -c pyproject.toml -r devtools -q --skip B311

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Tests (SQLite and PostgreSQL)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (types, lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # What ships to users. A finding here fails the build.
      - name: Dependency vulnerability audit (packages that ship)
        run: npm audit --omit=dev --audit-level=moderate

      # Everything, including the build and test tools. Reported but not blocking for now:
      # picomatch, which only development tools use (Vite, Vitest, ESLint), has an open advisory
      # (GHSA-fc5q-39xc-vjpf) and no fixed version exists yet. Remove continue-on-error once one
      # is released and the lockfile has it. See docs/security.md, "Dependency management".
      - name: Dependency vulnerability audit (all packages, report only)
        continue-on-error: true
        run: npm audit --audit-level=moderate

  # Drives a real browser through the production build against the real API, which runs with
  # simulated providers on a seeded throwaway database (see docs/testing.md, "Testing the dashboard").
  # Playwright starts both servers itself. Locally it uses Edge; here CI is set, so it uses the
  # Chromium downloaded below. It is the slowest job, so it has the longest timeout.
  e2e:
    name: Dashboard end-to-end (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The demo API needs only the runtime requirements. With no backend/.venv, the Playwright
      # config falls back to the `python` on the PATH, which is this one.
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies (lockfile only)
        working-directory: frontend
        run: npm ci --no-fund

      - name: Install the browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e

      - name: Keep the report when a test failed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Builds the container images and smoke-tests the whole stack through the nginx front door.
  docker:
    name: Docker (images and compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create a local-only .env from the template
        run: cp .env.example .env

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to become ready through nginx
        run: |
          curl --fail --silent --show-error \
            --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:3000/ready

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/me
          curl --fail --silent --show-error http://127.0.0.1:3000/some/spa/route | grep --quiet '<div id="root">'
          curl --silent --head http://127.0.0.1:3000/ | grep --ignore-case --quiet '^content-security-policy:'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes
