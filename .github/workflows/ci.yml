name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: no job needs to write to the repository or call the GitHub API.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, security, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cipherforge
          POSTGRES_DB: cipherforge_test
          # Throwaway service container on the runner's loopback; no credential to store.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cipherforge -d cipherforge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cipherforge@localhost:5432/cipherforge_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Static security analysis (bandit)
        run: bandit -c pyproject.toml -r app -q

      - name: Dependency vulnerability audit (pip-audit)
        run: pip-audit -r requirements.txt --progress-spinner off

      - name: Tests (SQLite and PostgreSQL)
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    name: Frontend (types, lint, tests, build, audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=moderate

  # Builds the container images and smoke-tests the whole stack through the nginx front door.
  docker:
    name: Docker (images and compose smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create a local-only .env from the template
        run: cp .env.example .env

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Build and start the stack
        run: docker compose up --build --detach

      - name: Wait for the API to become ready through nginx
        run: |
          curl --fail --silent --show-error \
            --retry 40 --retry-delay 3 --retry-connrefused --retry-all-errors \
            http://127.0.0.1:3000/ready

      - name: Smoke test
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          curl --fail --silent --show-error http://127.0.0.1:3000/api/v1/me
          curl --fail --silent --show-error http://127.0.0.1:3000/some/spa/route | grep --quiet '<div id="root">'
          curl --silent --head http://127.0.0.1:3000/ | grep --ignore-case --quiet '^content-security-policy:'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down --volumes
