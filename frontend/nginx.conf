# Served by nginxinc/nginx-unprivileged (non-root, port 8080). This file is included
# inside the http block, so it only contains the server definition.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # API payloads are small JSON documents.
    client_max_body_size 64k;

    # Security headers are declared once, here. nginx drops every inherited add_header
    # in a location that declares its own, so no location below may use add_header.
    # HSTS belongs on the TLS terminator in front of this container, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Container healthcheck; does not touch the backend.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The API: liveness, readiness and /api/*. Docker's embedded DNS (127.0.0.11) lets
    # nginx start before the backend exists and follow it across restarts. The
    # backend sets the same security headers; hiding them avoids duplicates.
    location ~ ^/(?:api/|health$|ready$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Build output is content-hashed, so it can be cached for a long time.
    # gzip is limited to these static files (never to API responses).
    location /assets/ {
        expires 1y;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }

    # Always revalidate the entry point so a new deployment is picked up.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths fall back to the entry point.
    location / {
        try_files $uri /index.html;
    }
}
