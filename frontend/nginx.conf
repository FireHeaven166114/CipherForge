# Served by nginxinc/nginx-unprivileged (non-root, port 8080). This file is included
# inside the http block, so it holds the one http-level piece the server needs (the access
# log format) followed by the server definition.

# Share links carry their secret in the path: /share/<token> in the browser and
# /api/v1/shares/<token>... at the API. The access log gets those paths with the token left
# out, so reading the log does not give access to anyone's download link. This covers the
# access log only; see docs/deployment.md for the error log.
map $request_uri $logged_uri {
    default            $request_uri;
    ~^/share/          "/share/[redacted]";
    ~^/api/v1/shares/  "/api/v1/shares/[redacted]";
}

# Never log $request, $request_uri or $uri here: they carry the unredacted path.
log_format cipherforge '$remote_addr [$time_local] "$request_method $logged_uri $server_protocol" $status $body_bytes_sent "$http_user_agent" $request_time';

server {
    listen 8080;
    server_name _;
    server_tokens off;

    # The image's own log files are links to the container's stdout and stderr.
    access_log /var/log/nginx/access.log cipherforge;

    root /usr/share/nginx/html;
    index index.html;

    # API payloads are small JSON documents. The two upload paths below raise this. The buffer
    # is as large as the limit, so a request body (a share password, say) is held in memory
    # and never written to a temporary file.
    client_max_body_size 64k;
    client_body_buffer_size 64k;

    # Security headers are declared once, here. nginx drops every inherited add_header
    # in a location that declares its own, so no location below may use add_header.
    # HSTS belongs on the TLS terminator in front of this container, not here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Container healthcheck; does not touch the backend.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The two uploads: a file to encrypt (POST /api/v1/files) and a capture file to analyse
    # (POST /api/v1/network/pcap). Both send the file as the raw request body. The ceiling here
    # is the largest the backend can be set to (NETWORK_MAX_PCAP_SIZE_MB allows up to 500,
    # MAX_ENCRYPTED_FILE_SIZE_MB up to 100); the backend enforces the limit actually set for
    # each. The body is passed on as it arrives instead of being written to disk here first,
    # so the backend can refuse an upload (not signed in, too large) before the rest is sent.
    # nginx uses the first regular-expression location that matches, so this one has to come
    # before the general API location below. Keep its proxy settings in step with that one.
    location ~ ^/api/v1/(?:files|network/pcap)$ {
        client_max_body_size 500m;
        proxy_request_buffering off;

        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_max_temp_file_size 0;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # The API: liveness, readiness and /api/*. Docker's embedded DNS (127.0.0.11) lets
    # nginx start before the backend exists and follow it across restarts. The
    # backend sets the same security headers; hiding them avoids duplicates.
    # A shared file is decrypted by the backend and sent through here, so a response is never
    # written to a temporary file (proxy_max_temp_file_size 0): a slow download makes nginx
    # wait for the client instead of spooling the plaintext to disk.
    location ~ ^/(?:api/|health$|ready$) {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_max_temp_file_size 0;

        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
    }

    # Build output is content-hashed, so it can be cached for a long time.
    # gzip is limited to these static files (never to API responses).
    location /assets/ {
        expires 1y;
        gzip on;
        gzip_types text/css application/javascript image/svg+xml;
        try_files $uri =404;
    }

    # Always revalidate the entry point so a new deployment is picked up.
    location = /index.html {
        expires -1;
    }

    # Single-page app: unknown paths fall back to the entry point.
    location / {
        try_files $uri /index.html;
    }
}
